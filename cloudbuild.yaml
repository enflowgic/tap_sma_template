# =============================================================================
# TAP Agent - Cloud Build Configuration for Cloud Run Deployment
# =============================================================================
#
# This Cloud Build configuration deploys your TAP agent to Cloud Run with
# A2A protocol support.
#
# CRITICAL: DO NOT ADD --use-http2 FLAG!
# =========================================
# SSE streaming requires HTTP/1.1 (the default). Cloud Run's --use-http2 flag
# causes "protocol error" disconnects because Uvicorn speaks HTTP/1.1 but
# Cloud Run would send HTTP/2 requests. This breaks all SSE streaming.
#
# Usage:
#   # Deploy with default settings
#   gcloud builds submit --config cloudbuild.yaml
#
#   # Deploy with custom agent slug
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_AGENT_SLUG=my-custom-agent
#
#   # Deploy to a specific region
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_REGION=us-east1
#
# Prerequisites:
#   1. Artifact Registry repository for Docker images
#   2. Cloud Run API enabled
#   3. tap-core package accessible (via Artifact Registry or bundled)
#
# =============================================================================

steps:
  # =========================================================================
  # Step 1: Build the Docker image
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}:latest'
      - '--build-arg'
      - 'BUILDKIT_INLINE_CACHE=1'
      - '.'

  # =========================================================================
  # Step 2: Push to Artifact Registry
  # =========================================================================
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}'
    waitFor: ['build']

  # =========================================================================
  # Step 3: Deploy to Cloud Run
  # =========================================================================
  # IMPORTANT: Do NOT add '--use-http2' - it breaks SSE streaming!
  # HTTP/1.1 (default) is required for Server-Sent Events to work correctly.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_AGENT_SLUG}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=${_MEMORY}'
      - '--cpu=${_CPU}'
      - '--timeout=${_TIMEOUT}'
      - '--concurrency=${_CONCURRENCY}'
      - '--min-instances=${_MIN_INSTANCES}'
      - '--max-instances=${_MAX_INSTANCES}'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},GOOGLE_GENAI_USE_VERTEXAI=true,LOG_LEVEL=${_LOG_LEVEL}'
    waitFor: ['push']

  # =========================================================================
  # Step 4: Output service URL
  # =========================================================================
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'get-url'
    entrypoint: bash
    args:
      - '-c'
      - |
        echo "=============================================="
        echo "Deployment Complete!"
        echo "=============================================="
        SERVICE_URL=$(gcloud run services describe ${_AGENT_SLUG} --region=${_REGION} --format='value(status.url)')
        echo "Service URL: $SERVICE_URL"
        echo "Agent Card:  $SERVICE_URL/.well-known/agent.json"
        echo "Health:      $SERVICE_URL/health"
        echo "A2A:         $SERVICE_URL/a2a"
        echo "=============================================="
    waitFor: ['deploy']

# =============================================================================
# Substitution Variables (Override with --substitutions flag)
# =============================================================================
substitutions:
  # Agent configuration
  _AGENT_SLUG: 'tap-template-agent'    # Service name and image tag
  _REGION: 'us-central1'                # Deployment region

  # Artifact Registry
  _ARTIFACT_REPO: 'tap-agents'          # Docker repository name

  # Cloud Run resources
  _MEMORY: '2Gi'                        # Memory allocation
  _CPU: '2'                             # CPU allocation
  _TIMEOUT: '120s'                      # Request timeout
  _CONCURRENCY: '80'                    # Max concurrent requests per instance
  _MIN_INSTANCES: '0'                   # Minimum instances (0 = scale to zero)
  _MAX_INSTANCES: '10'                  # Maximum instances

  # Logging
  _LOG_LEVEL: 'INFO'                    # Log level (DEBUG, INFO, WARNING, ERROR)

# =============================================================================
# Build Options
# =============================================================================
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'           # Faster builds

# =============================================================================
# Images to store in Artifact Registry
# =============================================================================
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}:${SHORT_SHA}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_AGENT_SLUG}:latest'

# =============================================================================
# Timeout for the entire build
# =============================================================================
timeout: '1200s'  # 20 minutes
