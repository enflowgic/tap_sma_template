# =============================================================================
# TAP AGENT ONBOARDING WORKFLOW
# =============================================================================
#
# This workflow enables automated deployment and registration of your agent
# to the TAP platform when you push to main or create a release.
#
# SETUP REQUIRED:
# 1. Install the TAP GitHub App on your repository
# 2. Configure the required secrets (see below)
# 3. Update the environment variables for your agent
#
# The TAP GitHub App will also receive webhooks and can trigger the
# Auto-Dev system for more complex onboarding scenarios.
#
# =============================================================================

name: TAP Agent Onboarding

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
      - master
    paths:
      - 'agent/**'
      - 'runtime/**'
      - 'tap-agent.yaml'

  # Trigger on release
  release:
    types: [published]

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip test step'
        required: false
        default: false
        type: boolean

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
# TODO: Update these for your agent
# =============================================================================
env:
  AGENT_SLUG: my-agent
  AGENT_PACKAGE: agent
  RUNTIME_DIR: runtime
  GCP_REGION: us-central1
  PYTHON_VERSION: '3.11'

jobs:
  # ===========================================================================
  # VALIDATION
  # ===========================================================================
  validate:
    name: Validate Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pyyaml

      - name: Validate tap-agent.yaml
        run: |
          python -c "
          import yaml
          import sys

          with open('tap-agent.yaml') as f:
              manifest = yaml.safe_load(f)

          # Required fields
          required = ['apiVersion', 'metadata', 'schemas', 'deployment']
          missing = [f for f in required if f not in manifest]
          if missing:
              print(f'ERROR: Missing required fields: {missing}')
              sys.exit(1)

          # Metadata validation
          metadata = manifest.get('metadata', {})
          if not metadata.get('slug'):
              print('ERROR: metadata.slug is required')
              sys.exit(1)

          # Schema validation
          schemas = manifest.get('schemas', {})
          if not schemas.get('input'):
              print('ERROR: schemas.input is required')
              sys.exit(1)

          print('tap-agent.yaml validation passed')
          "

      - name: Validate input schema
        run: |
          python -c "
          import yaml
          import importlib.util
          import sys

          with open('tap-agent.yaml') as f:
              manifest = yaml.safe_load(f)

          schema_config = manifest['schemas']['input']
          file_path = schema_config['file']
          class_name = schema_config['class']

          spec = importlib.util.spec_from_file_location('schema', file_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          schema_class = getattr(module, class_name, None)
          if schema_class is None:
              print(f'ERROR: Class {class_name} not found in {file_path}')
              sys.exit(1)

          # Verify it's a Pydantic model
          if not hasattr(schema_class, 'model_json_schema'):
              print(f'ERROR: {class_name} is not a Pydantic model')
              sys.exit(1)

          print(f'Input schema validation passed: {class_name}')
          "

  # ===========================================================================
  # TEST
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.RUNTIME_DIR }}/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          # Run tests if they exist
          if [ -d "tests" ]; then
            python -m pytest tests/ -v
          else
            echo "No tests directory found - skipping"
          fi

  # ===========================================================================
  # BUILD
  # ===========================================================================
  build:
    name: Build Container Image
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: ${{ always() && needs.validate.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.build.outputs.image_uri }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Build and push image
        id: build
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/tap-agents/${{ env.AGENT_SLUG }}:${{ github.sha }}"

          docker build -t ${IMAGE_URI} .
          docker push ${IMAGE_URI}

          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

  # ===========================================================================
  # DEPLOY
  # ===========================================================================
  deploy:
    name: Deploy to TAP
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment || 'staging' }}
      url: ${{ steps.deploy.outputs.endpoint_url }}

    permissions:
      contents: read
      id-token: write

    outputs:
      resource_name: ${{ steps.deploy.outputs.resource_name }}
      endpoint_url: ${{ steps.deploy.outputs.endpoint_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deployment dependencies
        run: |
          pip install google-cloud-aiplatform pyyaml

      - name: Deploy to Vertex AI
        id: deploy
        run: |
          cd ${{ env.RUNTIME_DIR }}
          python deploy_vertex.py 2>&1 | tee deploy.log

          # Extract resource name from output
          RESOURCE_NAME=$(grep -oP 'resource_name:\s*\K.*' deploy.log || echo "")
          echo "resource_name=${RESOURCE_NAME}" >> $GITHUB_OUTPUT

          if [ -z "$RESOURCE_NAME" ]; then
            echo "ERROR: Could not extract resource name from deployment"
            exit 1
          fi
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_REGION }}
          STAGING_BUCKET: ${{ secrets.GCP_STAGING_BUCKET }}

  # ===========================================================================
  # REGISTER
  # ===========================================================================
  register:
    name: Register with Cognee
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install registration dependencies
        run: |
          pip install httpx pyyaml google-auth pydantic

      - name: Register agent
        run: |
          python register_agent.py \
            --vertex-resource-name "${{ needs.deploy.outputs.resource_name }}"
        env:
          COGNEE_REGISTRY_URL: ${{ secrets.COGNEE_REGISTRY_URL }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GCP_PROJECT_ID }}

      - name: Post success comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## TAP Agent Deployed

              Your agent has been successfully deployed and registered!

              - **Agent Slug:** \`${{ env.AGENT_SLUG }}\`
              - **Resource:** \`${{ needs.deploy.outputs.resource_name }}\`
              - **Environment:** ${{ inputs.environment || 'staging' }}

              Test your agent in the [TAP Control Plane](https://tap.tailoredagents.ai).
              `
            })

# =============================================================================
# REQUIRED SECRETS
# =============================================================================
#
# Configure these secrets in your repository settings:
#
# GCP_WORKLOAD_IDENTITY_PROVIDER:
#   Format: projects/PROJECT_NUMBER/locations/global/workloadIdentityPools/POOL_ID/providers/PROVIDER_ID
#   Used for keyless authentication from GitHub Actions
#
# GCP_SERVICE_ACCOUNT:
#   Format: service-account@project.iam.gserviceaccount.com
#   Service account with permissions to deploy to Vertex AI
#
# GCP_PROJECT_ID:
#   Your Google Cloud project ID
#
# GCP_STAGING_BUCKET:
#   Format: gs://your-bucket-name
#   Bucket for Vertex AI staging
#
# COGNEE_REGISTRY_URL:
#   URL of the Cognee Registry service
#   Default: https://tap-cognee-registry-xxx.run.app
#
# =============================================================================
